[project]
name = "learning-companion"
version = "0.1.0"
description = "Learning Companion Chatbot served to Open WebUI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "pydantic-settings",
    "langchain",
    "langchain-xai",
    "uvicorn",
]

[dependency-groups]
dev = ["ruff", "pytest", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learning_companion"]

[tool.pytest.ini_options]
pythonpath = ["src"]
